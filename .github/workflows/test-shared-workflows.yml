# Self-test for the reusable workflows in this repository.
#
# Calls the workflows through local refs (./.github/workflows/...), so a pull
# request runs the versions on its own branch, not @v1. The fixtures it runs
# against are the root pyproject.toml / poetry.lock / book.toml and test/.
#
# Not covered here, because they need secrets and act on real systems:
#   - python-release.yml (GitHub App token, pushes tags, only runs on main)
#   - cloudflare-deploy.yml (Cloudflare credentials); its download step is
#     mirrored by the `deploy-download` job below
#   - python-pipeline.yml (deprecated; its release job forces the caller to
#     grant write permissions)

name: Test Shared Workflows

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  python-ci:
    uses: ./.github/workflows/python-ci.yml
    permissions:
      contents: read
      checks: write
    with:
      python-version: '3.13'
      source-dir: test/fixtures/sample_pkg
      coverage-min: 100

  python-style:
    uses: ./.github/workflows/python-style.yml
    permissions:
      contents: read
    with:
      python-version: '3.13'
      source-dir: test/fixtures/sample_pkg

  mdbook-build:
    uses: ./.github/workflows/mdbook-build.yml
    permissions:
      contents: read
    with:
      artifact-name: self-test-mdbook-site
      artifact-retention-days: 1

  # Same download step as cloudflare-deploy.yml (by name only, into the
  # workspace), without the deploy. Checks the artifact arrives and is
  # extracted in place rather than into a <name>/ subdirectory.
  deploy-download:
    name: Download site artifact (as cloudflare-deploy)
    needs: mdbook-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      ARTIFACT_NAME: ${{ needs.mdbook-build.outputs.artifact-name }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.mdbook-build.outputs.artifact-name }}

      - name: Check extracted layout
        run: |
          find . -maxdepth 2 -name '*.html' | sort
          if [ -d "$ARTIFACT_NAME" ]; then
            echo "::error::artifact was extracted into ./$ARTIFACT_NAME/"
            exit 1
          fi
          if [ -f html/index.html ]; then
            echo "index.html is at html/index.html" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f index.html ]; then
            echo "index.html is at the workspace root (artifact root = contents of html/)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::index.html not found in the downloaded artifact"
            exit 1
          fi
