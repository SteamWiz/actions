# Self-test for the reusable workflows in this repository.
#
# Calls the workflows through local refs (./.github/workflows/...), so a pull
# request runs the versions on its own branch, not @v1. The fixtures it runs
# against are the root pyproject.toml / poetry.lock / book.toml and test/.
#
# Not covered here, because they need secrets and act on real systems:
#   - python-release.yml (GitHub App token, pushes tags, only runs on main)
#   - cloudflare-deploy.yml (Cloudflare credentials); its download step, with
#     default inputs, is mirrored by the `deploy-download` job below, which
#     fails unless index.html lands in the directory the deploy step deploys
#   - python-pipeline.yml (deprecated; its release job forces the caller to
#     grant write permissions)

name: Test Shared Workflows

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  python-ci:
    uses: ./.github/workflows/python-ci.yml
    permissions:
      contents: read
      checks: write
    with:
      python-version: '3.13'
      source-dir: test/fixtures/sample_pkg
      coverage-min: 100

  python-style:
    uses: ./.github/workflows/python-style.yml
    permissions:
      contents: read
    with:
      python-version: '3.13'
      source-dir: test/fixtures/sample_pkg

  mdbook-build:
    uses: ./.github/workflows/mdbook-build.yml
    permissions:
      contents: read
    with:
      artifact-name: self-test-mdbook-site
      artifact-retention-days: 1

  # Same download step as cloudflare-deploy.yml with its default inputs
  # (artifact extracted into `directory: html`), without the deploy. Fails
  # unless index.html is at html/index.html, the path
  # `wrangler pages deploy html` deploys.
  deploy-download:
    name: Download site artifact (as cloudflare-deploy)
    needs: mdbook-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      DEPLOY_DIR: html
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.mdbook-build.outputs.artifact-name }}
          path: ${{ env.DEPLOY_DIR }}

      - name: Check index.html is where the deploy step looks
        run: |
          find . -maxdepth 3 -name 'index.html' | sort
          if [ ! -f "$DEPLOY_DIR/index.html" ]; then
            echo "::error::$DEPLOY_DIR/index.html not found; cloudflare-deploy would deploy a directory without the site"
            exit 1
          fi
          echo "index.html is at $DEPLOY_DIR/index.html" >> "$GITHUB_STEP_SUMMARY"
